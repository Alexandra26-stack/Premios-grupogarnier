<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Premios de Fin de Año 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estilos.css">
<style>
.login { max-width: 520px; justify-self: center; width: 100%; text-align: center; justify-items: center; }
.login form { display: grid; gap: 12px; width: 100%; }
.login .inp { text-align: center; font-size: 16px; padding: 12px 14px; border-radius: 999px; }
.login .code { letter-spacing: .5em; font-size: 22px; font-weight: 700; }
.login .btn { border-radius: 999px; }
.lock { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--pine), #b0283a); color: #fff; box-shadow: 0 10px 18px -10px rgba(142,20,36,.9); }
.rail .who .link { color: #e8c9a0; margin-top: 6px; display: inline-block; }
.loading { padding: 60px 0; }
.gala { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; }
.gw { position: relative; overflow: hidden; border-radius: 26px; padding: 30px 20px 24px; display: grid; justify-items: center; gap: 10px; text-align: center; color: #fff;
  background: radial-gradient(circle at 50% 28%, rgba(242,178,51,.35), transparent 55%), linear-gradient(165deg, #8e1424 0%, #5c0f1c 60%, #3d0a14 100%);
  box-shadow: 0 22px 40px -24px rgba(92,15,28,.9); animation: gwIn .7s cubic-bezier(.2,.9,.3,1.2) both; animation-delay: calc(var(--i) * 90ms); }
.gw::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .9;
  background: radial-gradient(circle, #f2b233 0 2px, transparent 3px) 12px 18px / 46px 52px, radial-gradient(circle, rgba(255,255,255,.7) 0 1.5px, transparent 2.5px) 30px 6px / 58px 44px, radial-gradient(circle, #ff8a80 0 1.6px, transparent 2.6px) 4px 30px / 64px 60px; }
.gw .ring { position: relative; padding: 6px; border-radius: 50%; background: conic-gradient(from 0deg, #f7d27a, #d4a24c, #fff3c4, #d4a24c, #f7d27a); box-shadow: 0 0 0 6px rgba(242,178,51,.18), 0 16px 30px -12px rgba(0,0,0,.6); }
.gw .ring .av { box-shadow: none; }
.gw .crown { position: absolute; top: -26px; left: 50%; transform: translateX(-50%) rotate(-8deg); filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
.gw .medal { position: absolute; right: -6px; bottom: 2px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: #fff; box-shadow: 0 6px 12px -4px rgba(0,0,0,.5); }
.gw .medal svg { width: 34px; height: 34px; }
.gw .gw-cat { position: relative; margin-top: 8px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: #f7d27a; }
.gw .gw-name { position: relative; font-family: var(--display); font-size: 22px; font-weight: 800; line-height: 1.15; }
.gw .gw-why { position: relative; font-size: 13px; color: #f6dccb; max-width: 240px; }
.gw .gw-ribbon { position: relative; margin-top: 4px; padding: 5px 14px; border-radius: 999px; background: #f2b233; color: #3d0a14; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
@keyframes gwIn { from { opacity: 0; transform: translateY(18px) scale(.94); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .gw { animation: none; } }
.galahead { text-align: center; display: grid; gap: 6px; justify-items: center; margin-bottom: 6px; }
.galahead h3 { font-size: 26px; margin: 0; }

</style>
</head>
<body>
<aside class="rail">
  <div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 40 40" width="40" height="40"><defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#de2826"/><stop offset="1" stop-color="#ff7a45"/></linearGradient></defs><circle cx="20" cy="20" r="20" fill="url(#mk)"/><path d="M28 14.5a10 10 0 1 0 1.5 7.5H20.5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="31" cy="9" r="2.4" fill="#f2b233"/></svg></div><div><b>Grupo Garnier</b><span>Talento Humano</span></div></div>
  <nav class="nav" role="tablist" id="tabs" aria-label="Secciones"></nav>
  <div class="who" id="whoBox"></div>
</aside>
<main id="main"><div class="empty loading">Cargando los premios…</div></main>

<div class="modal picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="box">
    <div class="clap" aria-hidden="true"></div>
    <div class="pk-head"><div><h3 id="pTitle">Elegir</h3><p class="sub" id="pSub"></p></div><button type="button" class="x" id="pClose" aria-label="Cerrar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <label class="f" for="pSearch">Buscar<input class="inp" id="pSearch" placeholder="Escribe un nombre" autocomplete="off"></label>
    <div class="plist" id="pList"></div>
    <label class="f" for="pMsg">Por qué (opcional, se puede leer en la ceremonia)<textarea id="pMsg" rows="2" maxlength="200"></textarea></label>
    <div class="row between"><button type="button" class="link danger" id="pClear">Quitar propuesta</button><button type="button" class="btn" id="pDone">Listo</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="assets/companias.js"></script>
<script src="assets/comun.js"></script>
<script>
const TABS = [['nominar', 'Proponer'], ['votar', 'Votar'], ['ganadores', 'Ganadores']];
const S = { pub: null, me: null, tab: 'nominar', correo: '', draftNom: {}, draftVote: {}, confirm: null, busy: false, error: '' };
const TK = CKEY('premios-sesion');
const LUGAR_BASE = 'Grupo Garnier';
const lugar = () => S.me ? `${S.me.empresa} · ${S.me.pais}` : LUGAR_BASE;
document.title = 'Premios de Fin de Año 2026 · Grupo Garnier';

function dispositivo() {
  try { let d = localStorage.getItem('premios-dispositivo'); if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); localStorage.setItem('premios-dispositivo', d); } return d; }
  catch { return 'sin-almacenamiento'; }
}
function sesion() { try { const s = JSON.parse(localStorage.getItem(TK)); return s && s.exp > Date.now() ? s : null; } catch { return null; } }
function guardarSesion(token) { try { localStorage.setItem(TK, JSON.stringify({ token, exp: Date.now() + 14 * 864e5 })); } catch {} }
function salir() { try { localStorage.removeItem(TK); } catch {} S.me = null; S.draftNom = {}; S.draftVote = {}; render(); }

/* ---------- Render ---------- */
function renderNav() {
  $('#tabs').innerHTML = TABS.map(([id, n], i) => `<button role="tab" id="tab-${id}" aria-selected="${S.tab === id}" data-tab="${id}"><small>${String(i + 1).padStart(2, '0')}</small>${n}</button>`).join('');
  $('#whoBox').innerHTML = S.me ? `<em>Ingresaste como</em><span>${esc(S.me.nombre)}</span><em>${esc(lugar())}</em><button type="button" class="link" data-act="salir">Salir</button>` : `<em>Premios 2026</em><span>${esc(LUGAR_BASE)}</span>`;
}

function hero() {
  const p = S.pub, cer = p.fechas.cer[0];
  const days = Math.max(0, Math.round((Date.parse(cer) - Date.parse(hoy())) / 864e5));
  const sub = { nominar: 'Propón a tus compañeros en cada categoría. Revisa bien antes de enviar: una vez enviadas no se pueden cambiar.', votar: 'Elige a uno de los 2 finalistas de cada categoría. Una vez enviado, tu voto no se puede cambiar.', ganadores: 'Los ganadores de este año.' }[S.tab];
  return `<section class="hero mini"><div class="copy"><span class="eyebrow">${esc(lugar())}</span>
    <h1>Premios de Fin de Año <span>2026</span></h1><div class="rule"></div>
    <p class="sub">${sub} Tus respuestas son confidenciales.</p></div>
    <div class="count"><span class="n">${days}</span><span class="l">${days === 1 ? 'día' : 'días'} para la ceremonia</span><span class="d">${fmt(cer)} de 2026</span><span class="phase-now">${p.fase === 'cerrado' ? faseNombre(p.fase) : 'Fase actual: ' + faseNombre(p.fase)}</span></div></section>`;
}

function loginView() {
  const err = S.error ? `<div class="banner">${esc(S.error)}</div>` : '';
  const icon = `<div class="lock" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>`;
  const sel = (id, label, list, v) => `<label class="sr-only" for="${id}">${label}</label><select class="sel inp" id="${id}" required><option value="">${label}</option>${list.map(n => `<option ${n === v ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  if (S.paso === 'grupo') return err + `<section class="card login">${icon}
    <h3>¿Dónde trabajas?</h3><p class="sub">Tu correo <b>${esc(S.correo)}</b> es nuevo. Elige tu empresa y tu país: solo verás y votarás a compañeros de tu mismo equipo.</p>
    <form id="fGrupo">${sel('empresa', 'Tu empresa', S.pub.empresas, S.empresa)}${sel('pais', 'Tu país', S.pub.paises, S.pais)}
    <button class="btn" type="submit" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Buscando…' : 'Continuar'}</button></form>
    <div class="row"><button type="button" class="link" data-act="otro">Usar otro correo</button></div></section>`;
  if (S.paso === 'nombre') return err + `<section class="card login">${icon}
    <h3>¿Quién eres?</h3><p class="sub">${esc(S.empresa)} · ${esc(S.pais)}. Elige tu nombre: quedará amarrado a tu correo <b>${esc(S.correo)}</b> y no podrás cambiarlo.</p>
    <form id="fNombre"><label class="sr-only" for="nombre">Tu nombre</label><select class="sel inp" id="nombre" required><option value="">— Elige tu nombre —</option>${S.libres.map(n => `<option>${esc(n)}</option>`).join('')}</select>
    <button class="btn" type="submit" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Entrando…' : 'Soy yo, entrar'}</button></form>
    <div class="row"><button type="button" class="link" data-act="atras">Cambiar empresa o país</button></div></section>`;
  return err + `<section class="card login">${icon}
    <h3>Ingresa a los premios</h3><p class="sub">Escribe tu correo y la clave del grupo que te compartió Talento Humano. Así nadie puede proponerse ni votarse a sí mismo.</p>
    <form id="fCorreo"><label class="sr-only" for="correo">Correo</label><input class="inp" id="correo" type="email" autocomplete="email" placeholder="tucorreo@empresa.com" value="${esc(S.correo)}" required>
    <label class="sr-only" for="claveg">Clave del grupo</label><input class="inp" id="claveg" type="password" autocomplete="current-password" placeholder="Clave del grupo" required>
    <button class="btn" type="submit" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Entrando…' : 'Entrar'}</button></form></section>`;
}

const cats = () => S.pub.categorias;
const demoBanner = () => `<div class="banner info">Modo demostración: puedes proponer, votar y ver ganadores de ejemplo. Nada de lo que hagas se guarda ni cuenta en los resultados.</div>`;

function nominarView() {
  if (!S.me) return loginView();
  const p = S.pub, sent = !!S.me.propuestasEn;
  const open = p.fase === 'nom' || S.me.demo;
  const picks = sent ? S.me.propuestas : S.draftNom;
  const locked = sent || !open;
  const done = cats().filter(c => picks[c.id]?.p).length;
  const notice = S.me.demo ? demoBanner() : sent ? `<div class="banner info">Ya enviaste tus propuestas el ${fmtFecha(S.me.propuestasEn)}. Quedaron registradas y no se pueden cambiar.</div>`
    : open ? '' : `<div class="banner">Las propuestas van del ${fmt(p.fechas.nom[0])} al ${fmt(p.fechas.nom[1])}. ${p.fase === 'prep' ? 'Podrás proponer cuando abra la fase.' : 'Esta fase ya cerró.'}</div>`;
  return notice + `<div class="tiles">${cats().map(c => {
    const pk = picks[c.id];
    return `<article class="tile"><div class="clap" aria-hidden="true"></div><div class="tile-body">
      <div class="ico">${catIcon(c.id)}</div><h4>${esc(c.nombre)}</h4><p>${esc(c.desc)}</p>
      ${pk?.p ? `<button type="button" class="chosen" data-act="pick" data-cat="${esc(c.id)}" ${locked ? 'disabled' : ''}>${avatar(pk.p, 40)}<span><b>${esc(pk.p)}</b><small>${sent ? 'Enviado' : pk.m ? 'Con mensaje · cambiar' : 'Cambiar'}</small></span></button>`
        : `<button type="button" class="btn ghost pickbtn" data-act="pick" data-cat="${esc(c.id)}" ${locked ? 'disabled' : ''}>Elegir compañero</button>`}
    </div></article>`;
  }).join('')}</div>
  <div class="sendbar"><span><b>${done}</b> de ${cats().length} categorías con propuesta</span>
    <button class="btn" data-act="sendnom" ${locked || !done || S.busy ? 'disabled' : ''}>${sent ? 'Propuestas enviadas' : S.busy ? 'Enviando…' : S.confirm === 'sendnom' ? 'Toca otra vez para confirmar' : 'Enviar mis propuestas'}</button></div>`;
}

function votarView() {
  const p = S.pub;
  if (!S.me) return loginView();
  const fin = S.me.finalistas;
  if (!fin) {
    return `<div class="banner">Los finalistas se mostrarán cuando abra la votación, el ${fmt(p.fechas.vot[0])}. La votación va hasta el ${fmt(p.fechas.vot[1])}.</div>
      <div class="tiles wide">${cats().map(c => `<article class="tile"><div class="clap" aria-hidden="true"></div><div class="tile-body">
        <div class="row" style="gap:14px;flex-wrap:nowrap"><div class="ico sm">${catIcon(c.id)}</div><div><h4>${esc(c.nombre)}</h4><p>${esc(c.desc)}</p></div></div>
        <div class="finals">${[1, 2].map(() => `<div class="person blank" aria-hidden="true"><span class="av empty" style="--s:56px">?</span><span>Por revelar</span></div>`).join('')}</div>
      </div></article>`).join('')}</div>`;
  }
  const sent = !!S.me.votoEn, open = p.fase === 'vot' || S.me.demo, locked = sent || !open;
  const picks = sent ? S.me.votos : S.draftVote, who = S.me.nombre;
  const list = cats().filter(c => (fin[c.id] || []).length);
  const done = list.filter(c => picks[c.id]).length;
  const notice = S.me.demo ? demoBanner() : sent ? `<div class="banner info">Ya enviaste tu voto el ${fmtFecha(S.me.votoEn)}. Quedó registrado y no se puede cambiar.</div>`
    : open ? '' : `<div class="banner">La votación fue del ${fmt(p.fechas.vot[0])} al ${fmt(p.fechas.vot[1])}.</div>`;
  return notice + `<div class="tiles wide">${list.map(c => `<article class="tile"><div class="clap" aria-hidden="true"></div><div class="tile-body">
      <div class="row" style="gap:14px;flex-wrap:nowrap"><div class="ico sm">${catIcon(c.id)}</div><div><h4>${esc(c.nombre)}</h4><p>${esc(c.desc)}</p></div></div>
      <div class="finals" role="radiogroup" aria-label="${esc(c.nombre)}">${fin[c.id].map(n => {
        const me = n === who, sel = picks[c.id] === n;
        return `<button type="button" role="radio" aria-checked="${sel}" class="person ${sel ? 'sel' : ''}" data-act="vote" data-cat="${esc(c.id)}" data-p="${esc(n)}" ${locked || me ? 'disabled' : ''}>${avatar(n, 56)}<span>${esc(n)}${me ? '<small>Eres tú</small>' : ''}</span></button>`;
      }).join('')}</div></div></article>`).join('')}</div>
    <div class="sendbar"><span><b>${done}</b> de ${list.length} categorías votadas</span>
      <button class="btn" data-act="sendvote" ${locked || !done || S.busy ? 'disabled' : ''}>${sent ? 'Voto enviado' : S.busy ? 'Enviando…' : S.confirm === 'sendvote' ? 'Toca otra vez para confirmar' : 'Enviar mi voto'}</button></div>`;
}

function ganadoresView() {
  if (!S.me) return loginView();
  const g = S.me.ganadores;
  if (!g || !Object.keys(g).length) return `<div class="card"><div class="empty">Los ganadores se revelan en la ceremonia del ${fmt(S.pub.fechas.cer[0])}.</div></div>`;
  const crown = `<svg class="crown" width="54" height="40" viewBox="0 0 54 40" aria-hidden="true"><path d="M5 34 2 10l13 10L27 2l12 18 13-10-3 24z" fill="#f2b233" stroke="#b07a1c" stroke-width="2" stroke-linejoin="round"/><circle cx="2" cy="10" r="3" fill="#fff3c4"/><circle cx="27" cy="2" r="3" fill="#fff3c4"/><circle cx="52" cy="10" r="3" fill="#fff3c4"/><rect x="5" y="31" width="44" height="6" rx="2" fill="#d4a24c"/></svg>`;
  const lista = cats().filter(c => g[c.id]);
  return (S.me.demo ? demoBanner() : '') + `<section class="card"><div class="galahead"><h3>Ganadores 2026</h3><p class="sub">${esc(lugar())} · ¡Felicitaciones a todos!</p></div>
    <div class="gala">${lista.map((c, i) => `<article class="gw" style="--i:${i}">
      <div class="ring">${crown}${avatar(g[c.id], 128)}<span class="medal">${catIcon(c.id)}</span></div>
      <span class="gw-cat">${esc(c.nombre)}</span>
      <span class="gw-name">${esc(g[c.id])}</span>
      <span class="gw-why">${esc(c.desc)}</span>
      <span class="gw-ribbon">Ganador 2026</span>
    </article>`).join('')}</div></section>`;
}

function render() {
  renderNav();
  if (!S.pub) return;
  const v = { nominar: nominarView, votar: votarView, ganadores: ganadoresView }[S.tab]();
  $('#main').innerHTML = hero() + v;
}

/* ---------- Selector de personas ---------- */
let PK = null;
function openPicker(cat) {
  const c = cats().find(x => x.id === cat);
  PK = { cat, q: '', sel: S.draftNom[cat]?.p || '' };
  $('#pTitle').textContent = c.nombre; $('#pSub').textContent = c.desc;
  $('#pMsg').value = S.draftNom[cat]?.m || ''; $('#pSearch').value = '';
  $('#pClear').hidden = !PK.sel;
  drawPeople(); $('#picker').classList.add('open'); $('#pSearch').focus();
}
function drawPeople() {
  const norm = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const list = S.me.equipo.filter(n => n !== S.me.nombre).filter(n => !PK.q || norm(n).includes(norm(PK.q)));
  $('#pList').innerHTML = list.map(n => `<button type="button" class="person ${n === PK.sel ? 'sel' : ''}" data-choose="${esc(n)}" aria-pressed="${n === PK.sel}">${avatar(n, 52)}<span>${esc(n)}</span></button>`).join('') || '<div class="empty">No encontramos ese nombre.</div>';
}
function closePicker() { $('#picker').classList.remove('open'); PK = null; }
$('#pSearch').addEventListener('input', e => { PK.q = e.target.value; drawPeople(); });
$('#pList').addEventListener('click', e => { const b = e.target.closest('[data-choose]'); if (!b) return; PK.sel = b.dataset.choose; drawPeople(); $('#pClear').hidden = false; });
$('#pDone').addEventListener('click', () => { if (PK?.sel) S.draftNom[PK.cat] = { p: PK.sel, m: $('#pMsg').value.trim() }; closePicker(); render(); });
$('#pClear').addEventListener('click', () => { delete S.draftNom[PK.cat]; closePicker(); render(); });
$('#pClose').addEventListener('click', closePicker);
$('#picker').addEventListener('click', e => { if (e.target.id === 'picker') closePicker(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

/* ---------- Acciones ---------- */
async function cargarYo() {
  const s = sesion();
  if (!s) { S.me = null; return; }
  try { S.me = await api('yo', { token: s.token }); }
  catch (e) { S.me = null; try { localStorage.removeItem(TK); } catch {} }
}

async function entrar(datos) {
  S.busy = true; S.error = ''; render();
  try {
    const r = await api('entrar', { correo: S.correo, clave: S.claveg, empresa: S.empresa, pais: S.pais, dispositivo: dispositivo(), ...datos });
    if (r.elegirGrupo) S.paso = 'grupo';
    else if (r.elegirNombre) { S.paso = 'nombre'; S.libres = r.libres; }
    else { S.paso = null; S.libres = null; S.claveg = ''; guardarSesion(r.token); await cargarYo(); toast(`Hola, ${r.nombre.split(' ')[0]}`); }
  } catch (err) { S.error = err.message; }
  S.busy = false; render();
}
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'fCorreo') { S.correo = $('#correo').value.trim().toLowerCase(); S.claveg = $('#claveg').value; S.empresa = ''; S.pais = ''; return entrar({}); }
  if (e.target.id === 'fGrupo') { S.empresa = $('#empresa').value; S.pais = $('#pais').value; if (!S.empresa || !S.pais) return; return entrar({}); }
  if (e.target.id === 'fNombre') { const n = $('#nombre').value; if (!n) return; return entrar({ nombre: n }); }
});

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-act]');
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.confirm = null; S.error = ''; try { localStorage.setItem('premios-tab', S.tab); } catch {} render(); window.scrollTo(0, 0); return; }
  const act = t.dataset.act;
  if (act === 'salir') return salir();
  if (act === 'otro') { S.paso = null; S.libres = null; S.empresa = ''; S.pais = ''; S.error = ''; return render(); }
  if (act === 'atras') { S.paso = 'grupo'; S.error = ''; return render(); }
  if (act === 'pick') return openPicker(t.dataset.cat);
  if (act === 'vote') { const c = t.dataset.cat; S.draftVote[c] = S.draftVote[c] === t.dataset.p ? undefined : t.dataset.p; if (!S.draftVote[c]) delete S.draftVote[c]; return render(); }
  if (act === 'sendnom' || act === 'sendvote') {
    if (S.confirm !== act) {
      S.confirm = act; clearTimeout(S.confirmT); S.confirmT = setTimeout(() => { S.confirm = null; render(); }, 6000);
      render(); toast('Después de enviar no podrás cambiarlo. Toca otra vez para confirmar.'); return;
    }
    S.confirm = null; clearTimeout(S.confirmT); S.busy = true; render();
    try {
      const s = sesion();
      if (!s) throw new Error('Tu sesión terminó. Vuelve a ingresar con tu correo.');
      const r = act === 'sendnom' ? await api('nominar', { token: s.token, picks: S.draftNom }) : await api('votar', { token: s.token, picks: S.draftVote });
      if (r.demo) { toast('Modo demostración: así se enviaría. No se guardó nada.'); S.busy = false; render(); return; }
      await cargarYo();
      toast(act === 'sendnom' ? '¡Gracias! Tus propuestas quedaron guardadas' : '¡Listo! Tu voto quedó registrado');
    } catch (err) {
      toast(err.message);
      if (/sesión terminó/.test(err.message)) salir();
    }
    S.busy = false; render();
  }
});

(async function boot() {
  try {
    S.pub = await api('publico');
  } catch (e) {
    $('#main').innerHTML = `<div class="card"><div class="empty">${esc(e.message)}</div></div>`; renderNav(); return;
  }
  const f = S.pub.fase;
  S.tab = f === 'vot' ? 'votar' : (f === 'cer' || f === 'cerrado') ? 'ganadores' : 'nominar';
  await cargarYo();
  render();
})();
</script>
</body>
</html>
