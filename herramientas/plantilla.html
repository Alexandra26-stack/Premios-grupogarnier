<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premios de Fin de Año Grupo Garnier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --red: #de2826; --red-dark: #ad1126; --coal: #2b2d31; --ink: #3a3a3a; --muted: #69727d; --concrete: #eef0f0; --line: #d0d2d3; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--concrete); color: var(--ink); font-family: "Work Sans", "Helvetica Neue", Arial, sans-serif; display: grid; place-items: center; padding: 16px; }
form { background: #fff; width: min(420px, 100%); padding: 32px; display: grid; gap: 16px; border-top: 6px solid var(--red); }
.brand { display: flex; gap: 12px; align-items: center; }
.mark { width: 40px; height: 40px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 22px; }
.brand b { display: block; letter-spacing: .08em; text-transform: uppercase; color: var(--coal); }
.brand span { font-size: 13px; color: var(--muted); }
h1 { margin: 8px 0 0; font-size: 26px; font-weight: 800; color: var(--coal); }
p { margin: 0; color: var(--muted); font-size: 14px; }
label { display: grid; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
input { font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 4px; background: #f6f9f9; text-transform: none; letter-spacing: normal; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
button { font: inherit; font-weight: 700; background: var(--red); color: #fff; border: 0; border-radius: 4px; padding: 12px; cursor: pointer; }
button:hover { background: var(--red-dark); }
button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--red-dark); font-weight: 600; min-height: 1.2em; }
</style>
</head>
<body>
<form id="f">
  <div class="brand"><div class="mark" aria-hidden="true">G</div><div><b>Grupo Garnier</b><span>Talento Humano</span></div></div>
  <h1>Premios de Fin de Año 2026</h1>
  <p>Esta página está cifrada. Escribe la contraseña que te compartió Talento Humano.</p>
  <label for="pw">Contraseña<input id="pw" type="password" autocomplete="current-password" required></label>
  <button id="go" type="submit">Entrar</button>
  <p class="err" id="err" role="alert"></p>
</form>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Verificando…'; err.textContent = '';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(P.iv) }, key, b(P.data)));
    document.open(); document.write(html); document.close();
  } catch {
    err.textContent = 'La contraseña no es correcta. Intenta de nuevo.';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});
</script>
</body>
</html>
